<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="fade" cx="85%" cy="80%" r="70%" fx="90%" fy="85%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="cornerFade">
      <rect width="1200" height="900" fill="url(#fade)"/>
    </mask>
  </defs>

  <g mask="url(#cornerFade)">

    <!-- ============================== -->
    <!-- CONSTELLATION LINES             -->
    <!-- Faint connections between stars -->
    <!-- ============================== -->
    <g fill="none" stroke="#729a5e" stroke-linecap="round">

      <!-- Primary constellation shape — large triangle-ish -->
      <line x1="980" y1="680" x2="850" y2="540" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="850" y1="540" x2="1050" y2="480" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="1050" y1="480" x2="980" y2="680" stroke-width="1.2" stroke-opacity="0.5"/>

      <!-- Secondary cluster — lower right -->
      <line x1="980" y1="680" x2="1120" y2="750" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="1120" y1="750" x2="1080" y2="850" stroke-width="1.2" stroke-opacity="0.5"/>
      <line x1="1080" y1="850" x2="950" y2="800" stroke-width="1.2" stroke-opacity="0.5"/>
      <line x1="950" y1="800" x2="980" y2="680" stroke-width="1" stroke-opacity="0.45"/>

      <!-- Bridge to mid-field -->
      <line x1="850" y1="540" x2="700" y2="600" stroke-width="1.2" stroke-opacity="0.5"/>
      <line x1="700" y1="600" x2="750" y2="720" stroke-width="1" stroke-opacity="0.45"/>
      <line x1="750" y1="720" x2="950" y2="800" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Upper reach -->
      <line x1="1050" y1="480" x2="1100" y2="350" stroke-width="1.2" stroke-opacity="0.5"/>
      <line x1="1100" y1="350" x2="960" y2="380" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="960" y1="380" x2="850" y2="540" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Far reach — fading toward center -->
      <line x1="700" y1="600" x2="560" y2="520" stroke-width="1" stroke-opacity="0.35"/>
      <line x1="560" y1="520" x2="580" y2="650" stroke-width="0.8" stroke-opacity="0.3"/>
      <line x1="580" y1="650" x2="700" y2="600" stroke-width="0.8" stroke-opacity="0.3"/>

      <!-- Wisps — isolated connections -->
      <line x1="560" y1="520" x2="450" y2="480" stroke-width="0.8" stroke-opacity="0.25"/>
      <line x1="450" y1="480" x2="400" y2="560" stroke-width="0.6" stroke-opacity="0.2"/>
      <line x1="1100" y1="350" x2="1150" y2="260" stroke-width="0.8" stroke-opacity="0.25"/>
      <line x1="960" y1="380" x2="880" y2="300" stroke-width="0.6" stroke-opacity="0.2"/>
      <line x1="750" y1="720" x2="650" y2="780" stroke-width="0.6" stroke-opacity="0.2"/>
      <line x1="1080" y1="850" x2="1160" y2="880" stroke-width="0.6" stroke-opacity="0.2"/>
    </g>

    <!-- ============================== -->
    <!-- STARS — bright points           -->
    <!-- ============================== -->
    <g>
      <!-- Bright stars (major nodes) -->
      <circle cx="980"  cy="680" r="4"   fill="#bdd4b0" opacity="0.9"/>
      <circle cx="850"  cy="540" r="3.5" fill="#bdd4b0" opacity="0.85"/>
      <circle cx="1050" cy="480" r="3.5" fill="#bdd4b0" opacity="0.85"/>
      <circle cx="1120" cy="750" r="3"   fill="#bdd4b0" opacity="0.8"/>
      <circle cx="1080" cy="850" r="3"   fill="#bdd4b0" opacity="0.8"/>
      <circle cx="700"  cy="600" r="3"   fill="#bdd4b0" opacity="0.75"/>

      <!-- Medium stars -->
      <circle cx="950"  cy="800" r="2.5" fill="#96b884" opacity="0.7"/>
      <circle cx="1100" cy="350" r="2.5" fill="#96b884" opacity="0.65"/>
      <circle cx="960"  cy="380" r="2.5" fill="#96b884" opacity="0.65"/>
      <circle cx="750"  cy="720" r="2.5" fill="#96b884" opacity="0.65"/>
      <circle cx="560"  cy="520" r="2"   fill="#96b884" opacity="0.55"/>
      <circle cx="580"  cy="650" r="2"   fill="#96b884" opacity="0.5"/>

      <!-- Dim stars (far field) -->
      <circle cx="450"  cy="480" r="1.5" fill="#96b884" opacity="0.4"/>
      <circle cx="400"  cy="560" r="1.5" fill="#96b884" opacity="0.35"/>
      <circle cx="1150" cy="260" r="1.5" fill="#96b884" opacity="0.35"/>
      <circle cx="880"  cy="300" r="1.5" fill="#96b884" opacity="0.3"/>
      <circle cx="650"  cy="780" r="1.5" fill="#96b884" opacity="0.3"/>
      <circle cx="1160" cy="880" r="1.5" fill="#96b884" opacity="0.3"/>

      <!-- Scattered dust — unconnected tiny dots -->
      <circle cx="1020" cy="580" r="1"   fill="#bdd4b0" opacity="0.35"/>
      <circle cx="900"  cy="620" r="1"   fill="#bdd4b0" opacity="0.3"/>
      <circle cx="820"  cy="750" r="1"   fill="#bdd4b0" opacity="0.3"/>
      <circle cx="1000" cy="420" r="1"   fill="#bdd4b0" opacity="0.25"/>
      <circle cx="780"  cy="450" r="1"   fill="#bdd4b0" opacity="0.2"/>
      <circle cx="640"  cy="700" r="1"   fill="#bdd4b0" opacity="0.2"/>
      <circle cx="500"  cy="600" r="0.8" fill="#bdd4b0" opacity="0.18"/>
      <circle cx="1140" cy="500" r="0.8" fill="#bdd4b0" opacity="0.18"/>
      <circle cx="350"  cy="620" r="0.8" fill="#bdd4b0" opacity="0.15"/>
      <circle cx="1060" cy="300" r="0.8" fill="#bdd4b0" opacity="0.15"/>
    </g>
  </g>
</svg>
